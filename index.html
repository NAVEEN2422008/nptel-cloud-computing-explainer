<script>
const assignmentsData = {"Week 1": [{"q_num": 1, "question": "Which of the following best represents the meaning of resource pooling in cloud computing?", "options": "A. Every customer receives a permanently dedicated physical server.\nB. Computing resources are dynamically assigned to multiple customers using a shared\ninfrastructure.\nC. Resources can only be accessed from a local network.\nD. Users must manually allocate hardware before using cloud services", "answer": "Correct Answer: B.", "solution": "Detailed Solution: Resource pooling is one of the NIST essential characteristics of cloud computing. Providers serve multiple customers using shared computing resources that are dynamically assigned and reassigned according to demand."}, {"q_num": 2, "question": "A startup rents virtual servers on Amazon EC2. The team installs and patches its own operating system, configures the web server, and manages the runtime and applications itself. The provider supplies only the virtualized compute, storage, and networking. This is best classified as:", "options": "A. SaaS\nB. PaaS\nC. IaaS\nD. FaaS", "answer": "Correct Answer: C", "solution": "Detailed Solution: The consumer manages the operating system, runtime, and applications while the provider supplies virtualized compute, storage, and networking. This division of responsibility is the defining feature of Infrastructure as a Service (IaaS)."}, {"q_num": 3, "question": "Which deployment model allows an organization to maintain cloud infrastructure exclusively for its own use, either on-premises or hosted by a third party?", "options": "A. Public Cloud\nB. Hybrid Cloud\nC. Community Cloud\nD. Private Cloud", "answer": "Correct Answer: D", "solution": "Detailed Solution: A private cloud is dedicated to a single organization, providing greater control over security, compliance, and resource management."}, {"q_num": 4, "question": "Virtualization technology allows multiple virtual machines (VMs) to run on a single physical system or on a cluster of physical systems. Which of the following statements is the MOST accurate?", "options": "A. Each VM always shares the same operating system kernel with the host OS.\nB. Multiple VMs can run different operating systems on the same physical machine simultaneously.\nC. Virtualization is only possible in cloud computing environments.\nD. Virtualization prevents resource overcommitment on the host system.", "answer": "Correct Answer: B", "solution": "Detailed Solution: Modern hypervisors (e.g., VMware, KVM) allow multiple VMs with different OSs to share the same physical hardware. Option A describes containers more than full VMs. Virtualization pre-dates cloud (so C is false), and resource overcommitment (CPU/memory overcommit) is actually a feature often used, not prevented (D is false)."}, {"q_num": 5, "question": "Consider the following statements about distributed systems (DS): (i) DS can improve scalability by adding more nodes to the system. (ii) DS can increase fault tolerance through data and service replication. (iii) DS guarantees lower latency for every single operation compared to a centralized system. Choose the MOST APPROPRIATE option:", "options": "A. (i) and (ii)\nB. Only (iii)\nC. (i) and (iii)\nD. (i), (ii), and (iii)", "answer": "Correct Answer: A", "solution": "Detailed Solution: Distributed systems improve scalability by adding nodes and increase fault tolerance through replication. However, distribution introduces network communication and coordination overhead, so lower latency for every operation is not guaranteed and some operations may be slower (iii is false)."}, {"q_num": 6, "question": "The combination of Service-Oriented Architecture (SOA) and Cloud Computing led to a paradigm where almost any IT capability can be delivered as a network-accessible service. This is often referred to as:", "options": "A. FTP\nB. SNTP\nC. XaaS\nD. FaaS", "answer": "Correct Answer: C", "solution": "Detailed Solution: XaaS = \u201cAnything/Everything as a Service\u201d, an umbrella term for delivering diverse IT services via the cloud. FaaS (Functions as a Service) is only one specific service model, not the broad paradigm."}, {"q_num": 7, "question": "Which of the following correctly describes a Type-2 (hosted) hypervisor?", "options": "A. It runs directly on the physical hardware without any underlying operating system.\nB. It runs as an application on top of a host operating system.\nC. It always provides lower virtualization overhead than a Type-1 hypervisor.\nD. It cannot run more than one virtual machine at a time.", "answer": "Correct Answer: B", "solution": "Detailed Solution: A Type-2 (hosted) hypervisor runs as an application on top of a host operating system (e.g., VirtualBox, VMware Workstation). A Type-1 (bare-metal) hypervisor runs directly on hardware and typically gives lower overhead, so A and C describe Type-1; D is false since hosted hypervisors can run multiple VMs."}, {"q_num": 8, "question": "Which of the following are advantages of Platform-as-a-Service (PaaS)? (i) Developers can focus primarily on application development. (ii) Automatic software updates for the underlying platform. (iii) Complete control over physical server hardware. (iv) Faster application deployment.", "options": "A. (i), (ii), and (iv)\nB. (ii) and (iii)\nC. (i) and (iii)\nD. (i), (ii), (iii), and (iv)", "answer": "Correct Answer: A", "solution": "Detailed Solution : PaaS simplifies software development by abstracting infrastructure management and providing managed runtime environments. Developers typically do not control physical hardware."}, {"q_num": 9, "question": "Which of the following services is most likely to be classified as Infrastructure as a Service (IaaS)?", "options": "A. Microsoft Word Online\nB. Amazon EC2 Virtual Machines\nC. Google Docs\nD. Salesforce CRM", "answer": "Correct Answer: B", "solution": "Detailed Solution:  Amazon EC2 provides virtual machines where users manage the operating system, software, and applications, making it an IaaS offering."}, {"q_num": 10, "question": "A __________ is a form of distributed computing in which a large number of geographically dispersed and often heterogeneous resources across multiple administrative domains are loosely coupled and coordinated to work together on a common, large-scale task.", "options": "A. Cluster\nB. Grid\nC. Node\nD. Hypervisor", "answer": "Correct Answer: B", "solution": "Detailed Solution: Grid computing coordinates geographically dispersed, heterogeneous, and loosely coupled resources spanning multiple administrative domains to solve large-scale tasks. Clusters are tightly coupled and co-located, a node is a single machine, and a hypervisor is virtualization software."}], "Week 2": [{"q_num": 1, "question": "A virtualization solution requires the guest operating system to invoke hypercalls instead of executing certain privileged instructions directly. This approach is known as:", "options": "A. Full Virtualization\nB. Hardware-assisted Virtualization\nC. Para-virtualization\nD. Containerization", "answer": "Correct Answer: C", "solution": "Detailed Solution: Para-virtualization modifies the guest operating system so that privileged operations are performed through hypercalls to the hypervisor. This reduces virtualization overhead but requires OS modification."}, {"q_num": 2, "question": "Which of the following is a key characteristic of full (hardware-assisted) virtualization, as opposed to para-virtualization?", "options": "A. Guest OS must be modified to issue hypercalls to the hypervisor.\nB. Guest OS runs unmodified, with the hypervisor and CPU extensions handling privileged\ninstructions.\nC. Guest and host must share the same operating system kernel.\nD. No hypervisor is involved at all.", "answer": "Correct Option: B", "solution": "Detailed Answer: In full (hardware-assisted) virtualization, an unmodified guest OS runs while CPU extensions (e.g., Intel VT-x, AMD-V) and the hypervisor transparently handle privileged instructions. Option A describes para-virtualization (guest OS modified via hypercalls), C describes containers, and D is false since a hypervisor is always present."}, {"q_num": 3, "question": "Which statement about a public cloud is MOST accurate?", "options": "A. It is dedicated to, and controlled by, a single organization behind its own firewall.\nB. Its infrastructure is provisioned for open use by the general public and is owned and\noperated by a cloud service provider.\nC. It is shared only among organizations that have common regulatory concerns.\nD. It always guarantees stronger data isolation than a private cloud.", "answer": "Correct Option: B", "solution": "Detailed Answer: A public cloud is provisioned for open use by the general public and is owned, managed, and operated by a cloud service provider on its own premises. Option A describes a private cloud, C describes a community cloud, and D is false since private clouds typically provide stronger isolation."}, {"q_num": 4, "question": "An application must repeatedly navigate, randomly access, and modify elements of a moderately sized XML document held in memory. Which XML parser API is MOST appropriate?", "options": "A. SAX (push-based, event-driven, forward-only)\nB. StAX (pull-based, event-driven, forward-only)\nC. DOM (builds an in-memory tree allowing random access and modification)\nD. None; an XML document cannot be modified once parsed", "answer": "Correct Option: C", "solution": "Detailed Answer: DOM builds a complete in-memory tree representation of the document, enabling random access, navigation, and in-place modification of elements. This suits documents that fit in memory and require manipulation. SAX and StAX are forward-only streaming parsers not designed for random access or modification, so they are unsuitable here."}, {"q_num": 5, "question": "Which statement correctly distinguishes a 'host OS', a 'guest OS', and a 'hypervisor'?", "options": "A. The host OS runs inside a VM, the guest OS runs on bare metal, and the hypervisor is a\nuser application.\nB. The hypervisor creates and manages VMs; each guest OS runs inside a VM; and for a\nType-2 hypervisor, the host OS is the OS on which the hypervisor runs.\nC. The guest OS and host OS are always identical copies of the same operating system.\nD. The hypervisor is simply the hardware layer located beneath the host OS.", "answer": "Correct Option: B", "solution": "Detailed Answer: The hypervisor creates and manages virtual machines; each guest OS runs inside its own VM; and for a Type-2 (hosted) hypervisor, the host OS is the operating system on which the hypervisor runs as an application. Option A reverses the host/guest roles, C is false, and D incorrectly describes the hypervisor as hardware."}, {"q_num": 6, "question": "An enterprise migrates its private cloud to a third-party managed data center. Which of the following concerns should be evaluated? (i) Service availability guarantees (SLAs) (ii) Compliance with data protection regulations (iii) Network latency between users and cloud resources", "options": "A. Only (i)\nB. (i) and (ii)\nC. (ii) and (iii)\nD. (i), (ii), and (iii)", "answer": "Correct Answer: D", "solution": "Detailed Solution: Hosted private clouds require organizations to evaluate SLA commitments, legal compliance regarding data location, and network performance because applications now depend on external connectivity."}, {"q_num": 7, "question": "In the traditional web services stack, which technology is used to describe a web service's interface \u2014 its operations, input/output messages, and how to invoke it?", "options": "A. UDDI\nB. WSDL\nC. SMTP\nD. HTML", "answer": "Correct Option: B", "solution": "Detailed Answer: WSDL is an XML-based language that describes a web service's interface: its operations, message formats, and binding/invocation details. UDDI is the registry used for discovery, SMTP is an email transport protocol, and HTML is a markup language for web pages."}, {"q_num": 8, "question": "Traditional SOAP-based web services provide which of the following capabilities? (i) Platform-independent communication (ii) XML-based message exchange (iii) Automatic service discovery through UDDI (iv) Guaranteed microsecond-level response latency", "options": "A. (i), (ii), and (iii)\nB. (ii) and (iv)\nC. Only (i)\nD. All of the above", "answer": "Correct Answer: A", "solution": "Detailed Solution: SOAP web services promote interoperability using XML and WSDL and support service discovery through UDDI. They do not guarantee extremely low-latency communication because XML processing introduces overhead."}, {"q_num": 9, "question": "Which of the following problems are effectively addressed by traditional web services, and which are NOT? (i) Passing through firewalls using standard HTTP/HTTPS (ii) Enabling interoperability across different programming languages and operating systems (iii) Ultra-low-latency, real-time inter-service communication (iv) Service discovery through registries like UDDI", "options": "A. Only (i) and (ii) are addressed\nB. (i), (ii), and (iv) are addressed; (iii) is NOT addressed\nC. Only (ii) is addressed\nD. All are addressed", "answer": "Correct Option: B", "solution": "Detailed Answer: Traditional web services address firewall transparency by using HTTP/HTTPS, ensure platform and language interoperability via XML, SOAP, and WSDL, and support service discovery through registries like UDDI. However, they do not provide ultra-low-latency, real-time communication, as XML parsing and SOAP overhead introduce delays, making modern alternatives like gRPC better suited for real-time scenarios."}, {"q_num": 10, "question": "In the Service-Oriented Architecture (SOA) model, which set of operations correctly maps the interactions among the service provider, service registry, and service requestor?", "options": "A. Publish (provider \u2192 registry), Find (requestor \u2192 registry), Bind (requestor \u2192 provider)\nB. Publish (requestor \u2192 provider), Find (provider \u2192 registry), Bind (registry \u2192 requestor)\nC. Bind (provider \u2192 registry), Publish (requestor \u2192 registry), Find (provider \u2192 requestor)\nD. Find (provider \u2192 registry), Publish (requestor \u2192 registry), Bind (provider \u2192 provider)", "answer": "Correct Option: A", "solution": "Detailed Answer: In SOA, the provider publishes its service description to the registry, the requestor finds a suitable service by querying the registry, and the requestor then binds to and invokes the provider directly. This publish\u2013find\u2013bind triangle defines the interactions among the three roles."}], "Week 3": [{"q_num": 1, "question": "Which of the following is least likely to be specified in an operational cloud Service Level Agreement(SLA)?", "options": "A. Recovery Time Objective (RTO)\nB. Exact encryption algorithm and key storage procedures\nC. Mean Time To Repair (MTTR) for incidents\nD. Penalty / credit calculation for downtime", "answer": "Answer: B", "solution": "Detailed Solution : SLAs describe service-level commitments (RTO, MTTR, penalties); low-level implementation/security procedures (exact algorithms/key storage) belong in security/operational documents, not the SLA."}, {"q_num": 2, "question": "A multilevel SLA generally consists of which of the following levels? (i) Corporate Level (ii) Customer Level (iii) Service Level", "options": "A. Only (i)\nB. (i) and (ii)\nC. (ii) and (iii)\nD. (i), (ii), and (iii)", "answer": "Correct Answer: D", "solution": "Detailed Solution: A multilevel SLA typically consists of corporate-level commitments applicable to all customers, customer-level agreements tailored to specific clients, and service-level agreements defining guarantees for individual services."}, {"q_num": 3, "question": "An enterprise signs a three-tier multilevel SLA with a cloud provider. However, the corporate-level SLA guarantees 95% uptime, the customer-level SLA specifies 98% uptime, and the service-level SLA guarantees 99.9% uptime. In case of a service disruption, which level of SLA is the provider LEGALLY BOUND to honor?", "options": "A. Corporate-level SLA, as it's the broadest agreement\nB. Customer-level SLA, as it's the middle ground\nC. Service-level SLA, as it's the most specific agreement\nD. The provider can choose the lowest applicable SLA", "answer": "Correct Answer: C", "solution": "Detailed Solution : Multilevel SLAs are structured hierarchically. The service-level SLA is the most granular and specific to the actual service delivery and is legally binding. If there's a conflict, the highest level of commitment (service-level SLA at 99.9%) applies. Corporate and customer-level SLAs provide broader guarantees, but disputes are typically resolved at the service-level SLA because that's where accountability directly lies with the provider's infrastructure."}, {"q_num": 4, "question": "Which pair of metrics is most directly used to quantify the reliability and recoverability commitments in a cloud SLA?", "options": "A. Availability (uptime %) and Mean Time To Recovery (MTTR)\nB. Lines of code and number of microservices\nC. Number of employees and office locations\nD. CPU clock speed and RAM size of the servers", "answer": "Answer: A", "solution": "Detailed Solution : Availability (uptime percentage) captures reliability, and Mean Time To Recovery (MTTR) captures how quickly the service is restored after an incident. The other options are organizational or low-level implementation details, not SLA commitments."}, {"q_num": 5, "question": "A cloud service guarantees 99.9% availability per 30-day month. What is the maximum allowable downtime in that month under the SLA? (Assume 30 days = 720 hours.)", "options": "A. About 0.72 hours\nB. About 7.2 hours\nC. About 3.6 hours\nD. About 72 minutes", "answer": "Answer: A", "solution": "Detailed Solution : Allowed downtime = (1 \u2212 0.999) \u00d7 720 hours = 0.001 \u00d7 720 = 0.72 hours \u2248 43 minutes per month."}, {"q_num": 6, "question": "Which feature primarily enables a parallel database to process large analytical queries faster than a traditional database?", "options": "A. Exclusive use of SQL\nB. Distributed query execution across multiple computing nodes\nC. Elimination of indexing\nD. Storing all data in a single server", "answer": "Correct Answer: B", "solution": "Detailed Solution: Parallel databases partition data and execute query operations across multiple nodes simultaneously, significantly improving analytical performance."}, {"q_num": 7, "question": "You are building a fraud-detection pipeline that must flag suspicious transactions within a few hundred milliseconds as they arrive. The system must: \u2022 Ingest about 500,000 transactions per second \u2022 Detect and alert within sub-second latency \u2022 Apply per-transaction rules and short sliding-window aggregations \u2022 Which architectural choice is LEAST suitable?", "options": "A. Apache Kafka feeding Apache Flink for continuous stream processing\nB. Amazon Kinesis with a real-time stream-processing application\nC. A nightly batch job on a data warehouse that scans the day's transactions\nD. Apache Pulsar with a stream processor for windowed aggregation", "answer": "Answer: C", "solution": "Detailed Solution : A nightly batch job introduces hours of latency and cannot meet a sub-second, real-time detection requirement. Kafka + Flink, Kinesis real-time applications, and Pulsar + stream processors are all designed for low-latency continuous stream processing and are suitable here."}, {"q_num": 8, "question": "A company stores petabytes of satellite imagery that must be processed in parallel by Spark clusters. Which storage system is most suitable?", "options": "A. Local SSD attached to a single virtual machine\nB. Object storage such as Amazon S3 or Google Cloud Storage\nC. Relational database server\nD. Client-side browser cache", "answer": "Correct Answer: B", "solution": "Detailed Solution: Cloud object storage provides virtually unlimited scalability, durability, and seamless integration with distributed processing frameworks like Spark and Hadoop."}, {"q_num": 9, "question": "A MapReduce job is designed to count word frequencies in 2 TB of text files. The mapper output is 1.5 TB (including overhead), and after the shuffle and sort phase, the data is 1.3 TB. During the reduce phase, a node runs out of disk space during the merge operation. Which of the following is the most likely cause and solution?", "options": "A. The mapper logic is inefficient; rewrite the mapper function\nB. The combiner phase didn't run; ensure combiner is explicitly configured to compress\nintermediate data locally\nC. The shuffle and sort didn't deduplicate keys; increase the number of reducers\nD. The network bandwidth is saturated; add more nodes to the cluster", "answer": "Correct Answer: B", "solution": "Detailed Solution : The combiner is a key MapReduce optimization that runs locally on each mapper node after the map phase, pre-aggregating intermediate key-value pairs to reduce their volume before shuffling. In a word count job, for example, it can sum occurrences of each word on the mapper node, potentially shrinking 1.5 TB of mapper output to 400\u2013500 GB. Without a combiner, all intermediate data is sent to the reducers, which can overwhelm disk space during the merge phase. By explicitly configuring a combiner, the amount of data transferred across the network and merged by reducers is greatly reduced, preventing disk exhaustion and improving overall job efficiency."}, {"q_num": 10, "question": "An OpenStack compute node contains 640 physical vCPUs. If the CPU allocation ratio is 5:1, what is the maximum number of virtual CPUs that may be allocated?", "options": "A. 3000\nB. 3200\nC. 3400\nD. 3500", "answer": "Correct Answer: B", "solution": "Detailed Solution: Total allocatable vCPUs = Physical vCPUs \u00d7 Allocation Ratio = 640 \u00d7 5 = 3200 vCPUs"}], "Week 4": [{"q_num": 1, "question": "Which Azure SQL Database service tier separates compute and storage so that storage can automatically grow up to 100 TB without requiring application downtime?", "options": "A. Basic\nB. Business Critical\nC. Hyperscale\nD. Standard", "answer": "Correct Answer: C", "solution": "Detailed Solution: The Hyperscale tier decouples compute and storage, allowing storage to automatically scale up to 100 TB. It is intended for very large databases and supports rapid scaling and fast backup/restore operations."}, {"q_num": 2, "question": "One company deploys two Azure Virtual Machines in different Availability Zones within the same Azure region. One data center experiences a complete power outage. Which statement is correct?", "options": "A. Both VMs will become unavailable because they are in the same region.\nB. The second VM can continue running because Availability Zones are isolated from each other.\nC. Azure automatically moves the failed VM to another region.\nD. Both VMs share the same cooling and networking infrastructure.", "answer": "Correct Answer: B", "solution": "Detailed Solution:  Availability Zones are physically separate data centers within the same Azure region, each with independent power, cooling, and networking. If one zone fails, resources in another zone continue to operate."}, {"q_num": 3, "question": "Which App Service pricing tier supports the highest number of deployment slots?", "options": "A. Basic\nB. Standard\nC. Premium (P1v3 and higher)\nD. Free", "answer": "Correct Answer: C", "solution": "Detailed Solution:  The Premium (P1v3 and higher) App Service plan supports up to 20 deployment slots, making it suitable for advanced DevOps and CI/CD scenarios."}, {"q_num": 4, "question": "An administrator notices that users can still access an Azure App Service website using http://. Which App Service configuration should be enabled to prevent unencrypted access?", "options": "A. Managed Identity\nB. Always On\nC. HTTPS Only\nD. Deployment Slots", "answer": "Correct Answer: C", "solution": "Detailed Solution: Enabling HTTPS Only forces all incoming HTTP requests to be redirected to HTTPS, preventing unencrypted communication."}, {"q_num": 5, "question": "Which Google Cloud database service is designed specifically for structured relational data with global consistency and horizontal scalability?", "options": "A. Firestore\nB. Cloud SQL\nC. Cloud Spanner\nD. Memorystore", "answer": "Correct Answer: C", "solution": "Detailed Solution: Cloud Spanner is a globally distributed relational database that combines SQL support, horizontal scalability, and strong consistency. Firestore is NoSQL, Cloud SQL scales primarily vertically, and Memorystore is an in-memory cache."}, {"q_num": 6, "question": "A virtual machine requires an additional 100 GB persistent disk that should remain intact even after the VM is terminated. Which OpenStack service manages this storage?", "options": "A. Nova\nB. Swift\nC. Cinder\nD. Keystone", "answer": "Correct Answer: C.", "solution": "Detailed Solution: Cinder provides persistent block storage volumes independent of the VM lifecycle. If the VM is deleted, the Cinder volume remains unless explicitly removed."}, {"q_num": 7, "question": "Which statement correctly distinguishes GKE from Cloud Run?", "options": "A. GKE only supports virtual machines.\nB. Cloud Run requires users to manage Kubernetes clusters.\nC. GKE manages Kubernetes clusters, while Cloud Run executes containers without requiring\ncluster management.\nD. Both services require manual Kubernetes control plane management.", "answer": "Correct Answer: C", "solution": "Detailed Solution: GKE is a managed Kubernetes service, whereas Cloud Run is a serverless container platform where Google manages the underlying infrastructure and scaling."}, {"q_num": 8, "question": "A company collects millions of IoT sensor events every minute. The data must be ingested in real time, stored in a scalable analytical warehouse, and visualized through interactive dashboards. Which GCP architecture best satisfies these requirements?", "options": "A. Cloud SQL + Cloud Functions + Looker\nB. Pub/Sub + BigQuery + Looker Studio\nC. Firestore + Compute Engine + Bigtable\nD. Cloud Storage + Memorystore + App Engine", "answer": "Correct Answer: B", "solution": "Detailed Solution: Pub/Sub provides scalable real-time event ingestion. BigQuery stores petabyte- scale analytical data and supports SQL queries. Looker Studio connects directly to BigQuery for dashboards and reports.Firestore is operational NoSQL storage, while Cloud SQL is not suitable for high-volume analytics."}, {"q_num": 9, "question": "A DevOps engineer wants to route all production traffic to version v3 of an App Engine service. Which command is correct?", "options": "A. gcloud app services set-traffic default --splits=v3=1\nB. gcloud app deploy --traffic=v3\nC. gcloud app versions promote v3\nD. gcloud app services update v3", "answer": "Correct Answer: A", "solution": "Detailed Solution: Setting the split to v3=1 directs 100% of traffic to version v3."}, {"q_num": 10, "question": "Which OpenStack service is primarily responsible for routing tenant traffic between internal and external networks?", "options": "A. Nova\nB. Neutron\nC. Keystone\nD. Swift", "answer": "Correct Answer: B", "solution": "Detailed Solution: Neutron provides networking services, including virtual networks, routers, DHCP, security groups, and floating IPs."}], "Week 5": [{"q_num": 1, "question": "A cloud provider guarantees 99% availability. A customer's application operates 12 hours per day.What is the maximum allowable downtime during a 30-day month without violating the SLA?", "options": "A. 3.6 hours\nB. 6 hours\nC. 7.2 hours\nD. 9 hours", "answer": "Correct Answer: A", "solution": "Detailed Solution: Scheduled time 12\u00d730=360 hours Allowed downtime :1%=0.01\u00d7360=3.6 hours"}, {"q_num": 2, "question": "A cloud server dynamically activates additional CPU cores to handle a sudden spike in user requests. What is the most likely impact on the server's power consumption?", "options": "A. Power consumption decreases because the workload is distributed.\nB. Power consumption remains unchanged since CPU frequency is fixed.\nC. Power consumption increases as additional CPU cores become active.\nD. Power consumption depends only on the amount of RAM used.", "answer": "Correct Answer: C", "solution": "Detailed Solution: Activating more CPU cores increases overall power consumption because each active core consumes power. Although techniques such as Dynamic Voltage and Frequency Scaling (DVFS) can improve energy efficiency, the total power generally increases as more cores are utilized."}, {"q_num": 3, "question": "Which cloud characteristic most directly helps organizations avoid large upfront hardware investments?", "options": "A. Elastic scalability\nB. Pay-as-you-go pricing\nC. Fault tolerance\nD. Multi-tenancy", "answer": "Correct Answer: B", "solution": "Detailed Solution: Pay-as-you-go pricing allows customers to pay only for consumed resources, eliminating the need for significant upfront hardware purchases."}, {"q_num": 4, "question": "An HDFS cluster has a block size of 128 MB. A 700 MB input file is processed using MapReduce. Assuming one map task per HDFS block, how many map tasks are created?", "options": "A. 5\nB. 6\nC. 7\nD. 8", "answer": "Correct Answer: B", "solution": "Detailed Solution: Blocks 700 MB = 128 + 128 + 128 + 128 + 128 + 60= 6 blocks One mapper per block so 6 map tasks"}, {"q_num": 5, "question": "Which virtualization component is primarily responsible for creating and managing virtual machines?", "options": "A. Operating System Kernel\nB. Hypervisor\nC. BIOS\nD. Device Driver", "answer": "Correct Answer: B", "solution": "Detailed Solution: A hypervisor (Virtual Machine Monitor) creates, runs, and manages virtual machines by abstracting the underlying physical hardware."}, {"q_num": 6, "question": "Which MapReduce component determines which Reducer receives a particular key?", "options": "A. Combiner\nB. Partitioner\nC. RecordWriter\nD. InputSplit", "answer": "Correct Answer: B", "solution": "Detailed Solution: The Partitioner determines the destination Reducer for each intermediate key. By default, Hadoop uses a hash-based partitioner to distribute keys among Reducers."}, {"q_num": 7, "question": "Which MapReduce component is optional and may execute zero, one, or multiple times?", "options": "A. Mapper\nB. Reducer\nC. Combiner\nD. RecordReader", "answer": "Correct Answer: C", "solution": "Detailed Solution:The Combiner is an optional optimization. Hadoop does not guarantee that it will execute, so algorithms must remain correct even if the Combiner is skipped."}, {"q_num": 8, "question": "A cloud provider observes that many physical servers are running at only 15% CPU utilization. To reduce electricity costs, it migrates virtual machines onto fewer servers and powers off the idle hosts while ensuring that application performance remains within SLA limits. Which scheduling strategy is being applied?", "options": "A. Round-Robin Scheduling\nB. Energy-Aware Scheduling\nC. First-Come-First-Serve Scheduling\nD. Fair Scheduling", "answer": "Correct Answer: B", "solution": "Detailed Solution: Energy-aware scheduling consolidates workloads onto fewer physical machines, allowing unused servers to be switched to low-power or off states. This reduces energy consumption while maintaining the required Quality of Service (QoS)."}, {"q_num": 9, "question": "Statement 1: Elasticity enables cloud users to increase or decrease resources according to workload demand. Statement 2: Elasticity helps organizations avoid paying for unused computing resources.", "options": "A. Both statements are true.\nB. Both statements are false.\nC. Statement 1 is true and Statement 2 is false.\nD. Statement 1 is false and Statement 2 is true.", "answer": "Correct Answer: A", "solution": "Detailed Solution: Elasticity allows resources to scale dynamically. Since resources can be released when demand decreases, organizations avoid paying for idle infrastructure."}, {"q_num": 10, "question": "Average demand = 75 units,Peak demand = 225 units,The cloud provider offers a utility premium of 2.8. Which statement is true?", "options": "A. Cloud cost < Owning cost\nB. Cloud cost > Owning cost\nC. Both costs are equal\nD. None of the above", "answer": "Correct Answer: A", "solution": "Detailed Solution: Maximum premium 225/75=3  Since 2.8<3 .Cloud remains cheaper."}], "Week 6": [{"q_num": 1, "question": "A database stores customer records in encrypted form. However, an administrator accidentally changes several account balances due to a software bug. Which security objective has failed?", "options": "A) Confidentiality only\nB) Integrity only\nC) Availability only\nD) Confidentiality and Availability", "answer": "Correct Answer: B", "solution": "Detailed Solution: Encryption protects confidentiality but does not prevent authorized users or software from incorrectly modifying data. The erroneous modification violates integrity."}, {"q_num": 2, "question": "An employee logs into a fake VPN portal that perfectly imitates the company's official login page. Before any credentials are entered, which security property has already been compromised?", "options": "A) Confidentiality\nB) Integrity\nC) Availability\nD) Authenticity", "answer": "Correct Answer: D", "solution": "Detailed Solution: The fake portal falsely claims to be the legitimate VPN service. The attack exploits authenticity before any confidential information is disclosed."}, {"q_num": 3, "question": "Which of the following attacks is NOT considered a passive attack?", "options": "A) Packet sniffing\nB) Traffic analysis\nC) Session hijacking\nD) Network monitoring", "answer": "Correct Answer: C", "solution": "Detailed Solution: Session hijacking allows an attacker to take over an active communication session by injecting or modifying packets. Since it alters the communication, it is an active attack. Packet sniffing, traffic analysis, and network monitoring only observe communications without altering them and are therefore passive attacks."}, {"q_num": 4, "question": "Which of the following attacks cannot directly modify the contents of transmitted data?", "options": "A) Replay attack\nB) Man-in-the-Middle attack\nC) Eavesdropping\nD) Masquerading", "answer": "Correct Answer: C", "solution": "Detailed Solution: Eavesdropping only captures data being transmitted and does not modify or inject messages. Hence, it is a passive attack."}, {"q_num": 5, "question": "Which of the following best describes a Denial-of-Service (DoS) attack?", "options": "A) An attacker secretly monitors network traffic without modifying it.\nB) An attacker floods a server with excessive requests, making the service unavailable to legitimate\nusers.\nC) An attacker impersonates a legitimate user to gain unauthorized access.\nD) An attacker modifies data during transmission between two communicating parties.", "answer": "Correct Answer: B", "solution": "Detailed Solution: A Denial-of-Service (DoS) attack attempts to make a service or resource unavailable by overwhelming it with excessive traffic or resource requests. This is an active attack because it interferes with the normal operation of the system."}, {"q_num": 6, "question": "Which of the following activities is least likely to be considered part of the reconnaissance phase?", "options": "A) Performing DNS enumeration to identify subdomains\nB) Scanning the target to discover open ports and running services\nC) Exploiting a buffer overflow vulnerability to gain administrator privileges\nD) Searching public websites and social media for organizational information", "answer": "Correct Answer: C", "solution": "Detailed Solution: Reconnaissance involves gathering information about the target using passive or active techniques. DNS enumeration, port scanning, and Open-Source Intelligence (OSINT) are common reconnaissance activities. Exploiting a buffer overflow is part of the exploitation (attack) phase, not reconnaissance."}, {"q_num": 7, "question": "Statement I: Authentication determines whether a user is allowed to access a resource. Statement II: Authorization determines what actions an authenticated user is permitted to perform. Options:", "options": "A) Statement I is TRUE and Statement II is FALSE.\nB) Statement I is FALSE and Statement II is TRUE.\nC) Both statements are TRUE.\nD) Both statements are FALSE.", "answer": "Correct Answer: B", "solution": "Detailed Solution: Authentication verifies who the user is, whereas authorization determines what that authenticated user is allowed to do."}, {"q_num": 8, "question": "A financial institution must install a custom Linux kernel module, configure firewall rules at the operating system level, and deploy proprietary database software. However, it does not want to purchase or maintain physical servers. Which cloud service model is most appropriate?", "options": "A) SaaS\nB) PaaS\nC) IaaS\nD) FaaS", "answer": "Correct Answer: C", "solution": "Detailed Solution: The organization requires control over the operating system and installed software, which is available in IaaS. The cloud provider manages the underlying physical infrastructure, while the customer manages the OS, middleware, and applications."}, {"q_num": 9, "question": "An organization discovers that backups of its confidential data are automatically replicated to another country without its knowledge. Which cloud security concern has been violated?", "options": "A) Data Location\nB) Recovery\nC) Virtualization\nD) Resource Pooling", "answer": "Correct Answer: A", "solution": "Detailed Solution: Automatic replication across geographic regions may violate legal or organizational requirements governing where sensitive data is stored."}, {"q_num": 10, "question": "Which of the following cloud design practices is most effective in reducing vendor lock-in?", "options": "A) Using provider-specific APIs whenever possible\nB) Developing applications using open standards and portable technologies\nC) Storing data only in proprietary database formats\nD) Relying exclusively on managed proprietary services", "answer": "Correct Answer: B", "solution": "Detailed Solution:   Open standards, containerization, and portable technologies reduce dependence on any single provider and simplify migration."}], "Week 7": [{"q_num": 1, "question": "Which of the following applications is least suitable for computation offloading to a remote cloud in Mobile Cloud Computing (MCC)?", "options": "A) Image rendering requiring intensive GPU computation\nB) Large-scale machine learning inference\nC) Emergency collision avoidance requiring millisecond response\nD) Video transcoding", "answer": "Correct Answer: C", "solution": "Detailed Solution: Safety-critical real-time applications require extremely low latency. Network delays and connectivity uncertainty make cloud execution unsuitable. Such tasks are better handled locally or at nearby edge/fog nodes."}, {"q_num": 2, "question": "A cloud-based mobile application automatically allocates additional computing resources during a sudden surge in users and releases them when demand decreases. Which cloud characteristic is demonstrated?", "options": "A) Resource pooling\nB) Rapid elasticity\nC) Location independence\nD) Broad network access", "answer": "Correct Answer: B", "solution": "Detailed Solution: Rapid elasticity enables cloud resources to scale up or down automatically according to workload, ensuring efficient resource utilization and performance."}, {"q_num": 3, "question": "Dynamic computation offloading primarily aims to optimize which combination of objectives?", "options": "A) Screen brightness and storage capacity\nB) Execution time, energy consumption, and resource utilization\nC) Camera quality and display refresh rate\nD) Cloud subscription cost only", "answer": "Correct Answer: B", "solution": "Detailed Solution: Dynamic offloading balances performance and energy by considering execution delay, battery consumption, CPU utilization, and network conditions."}, {"q_num": 4, "question": "A mobile augmented reality application requires object recognition with an end-to-end response time below 20 ms. Which infrastructure is most appropriate?", "options": "A) A geographically distant public cloud data center\nB) A nearby cloudlet connected through a high-speed local network\nC) Local storage only\nD) An offline mobile application", "answer": "Correct Answer: B", "solution": "Detailed Solution: Augmented reality applications are highly latency-sensitive. A nearby cloudlet minimizes communication delay and provides computational resources close to the user, unlike a remote cloud."}, {"q_num": 5, "question": "A healthcare application stores patient records in the cloud. Which security requirement is most critical to ensure that unauthorized users cannot access sensitive medical information?", "options": "A) Elasticity\nB) Data confidentiality\nC) Resource pooling\nD) Load balancing", "answer": "Correct Answer: B", "solution": "Detailed Solution: Medical records contain sensitive information. Confidentiality ensures that only authorized individuals can access the data."}, {"q_num": 6, "question": "Which limitation of traditional cloud computing is primarily addressed by fog computing?", "options": "A) Limited virtualization support\nB) High network latency caused by distant cloud data centers\nC) Lack of cloud storage\nD) Insufficient computing power in cloud servers", "answer": "Correct Answer: B", "solution": "Detailed Solution: Fog computing places computational resources closer to end devices, minimizing the delay associated with transmitting data to distant cloud data centers."}, {"q_num": 7, "question": "Which statement about fog nodes is FALSE?", "options": "A) They may perform filtering and aggregation of sensor data.\nB) They are usually located close to IoT devices.\nC) They permanently store all enterprise data.\nD) They reduce communication with distant cloud servers.", "answer": "Correct Answer: C", "solution": "Detailed Solution: Fog nodes mainly perform temporary processing and short-term storage. Long- term storage is generally handled by cloud data centers."}, {"q_num": 8, "question": "Statement 1: Geospatial Cloud Computing enables parallel processing of massive satellite imagery by distributing computation across multiple cloud nodes. Statement 2: Distributed storage and parallel processing frameworks reduce execution time for large geospatial datasets compared with a single desktop workstation.", "options": "A) Both Statement 1 and Statement 2 are true, and Statement 2 is the correct explanation of\nStatement 1\nB) Both Statement 1 and Statement 2 are true, but Statement 2 is not the correct explanation of\nStatement 1\nC) Statement 1 is true, but Statement 2 is false\nD) Statement 1 is false, but Statement 2 is true", "answer": "Correct Answer: A", "solution": "Detailed Solution: Distributed storage and parallel computation are the fundamental reasons cloud platforms efficiently process massive geospatial datasets."}, {"q_num": 9, "question": "A cloud platform divides a large raster image into tiles for parallel processing. Which challenge must be carefully addressed to ensure accurate results?", "options": "A) Screen resolution of client devices\nB) Boundary effects between adjacent image tiles\nC) Keyboard input latency\nD) Number of GIS users", "answer": "Correct Answer: B", "solution": "Detailed Solution: Many raster operations (e.g., filtering, convolution, terrain analysis) require neighboring pixels. Partitioning into tiles can introduce boundary effects unless overlap or edge handling is implemented."}, {"q_num": 10, "question": "A wearable ECG sensor continuously streams a patient's heart signals. Which architecture is most appropriate to detect cardiac abnormalities within a few milliseconds?", "options": "A) IoT sensors \u2192 Remote Cloud \u2192 Physician\nB) IoT sensors \u2192 Fog/Edge Node \u2192 Cloud\nC) IoT sensors \u2192 Local Storage \u2192 Weekly Upload\nD) IoT sensors \u2192 FTP Server \u2192 Desktop GIS", "answer": "Correct Answer: B", "solution": "Detailed Solution: Delay-sensitive healthcare applications require immediate processing at nearby fog/edge nodes. The cloud is mainly used for long-term storage, historical analysis, and model training."}], "Week 8": [{"q_num": 1, "question": "Which command is used to remove a Docker image that is no longer required?", "options": "A) docker rm\nB) docker rmi\nC) docker delete\nD) docker remove", "answer": "Correct Answer: B", "solution": "Detailed Solution: docker rmi removes one or more Docker images from the local system. docker rm is used to remove containers, not images."}, {"q_num": 2, "question": "Which Docker command is primarily used to list all available Docker networks?", "options": "A) docker network ls\nB) docker network show\nC) docker net ps\nD) docker networks", "answer": "Correct Answer: A", "solution": "Detailed Solution: docker network ls displays all Docker networks available on the host. It shows information such as network ID, name, driver, and scope."}, {"q_num": 3, "question": "Which of the following is the most accurate comparison between VMs and containers?", "options": "A) VMs share the host kernel, while containers have separate kernels\nB) Containers generally share the host kernel, while VMs virtualize hardware and run separate\nguest OS kernels\nC) Both always require separate guest operating systems\nD) Containers require more resources than VMs because they include a complete OS", "answer": "Correct Answer: B", "solution": "Detailed Solution: A VM typically includes a complete guest OS and its own kernel, operating on virtualized hardware. Containers share the host kernel and isolate applications at the operating- system level, making them generally lighter than VMs."}, {"q_num": 4, "question": "What is the primary role of etcd in a Kubernetes cluster?", "options": "A) Running application containers\nB) Storing Kubernetes cluster state and configuration data\nC) Scheduling Pods onto Nodes\nD) Providing container images", "answer": "Correct Answer: B", "solution": "Detailed Solution: etcd is a distributed key-value store used by Kubernetes to persist important cluster state, configuration, and metadata. The Kubernetes control plane relies on it as its backing data store."}, {"q_num": 5, "question": "Which of the following is an example of a Type 2 (hosted) hypervisor?", "options": "A) VMware ESXi\nB) Xen\nC) Oracle VirtualBox\nD) Microsoft Hyper-V Server", "answer": "Correct Answer: C", "solution": "Detailed Solution: Oracle VirtualBox is a Type 2 hypervisor because it runs as an application on top of an existing host operating system. VMware ESXi and Xen are examples of Type 1 hypervisors."}, {"q_num": 6, "question": "A cloud data center has 100 physical servers, but only 40 are heavily utilized while the remaining servers operate at very low utilization. Which strategy would MOST effectively reduce energy consumption?", "options": "A) Distribute VMs equally across all 100 servers\nB) Consolidate VMs onto fewer servers and switch idle servers to a low-power state\nC) Increase CPU frequency on all servers\nD) Duplicate every VM across multiple servers", "answer": "Correct Answer: B", "solution": "Detailed Solution: VM consolidation migrates workloads from lightly loaded servers onto fewer physical machines. Underutilized servers can then be switched to sleep or power-off states, reducing unnecessary energy consumption."}, {"q_num": 7, "question": "In a Sensor Cloud environment, why is a middleware layer often required between Wireless Sensor Networks (WSNs) and cloud services?", "options": "A) To increase the physical size of sensor nodes\nB) To abstract heterogeneous sensors and provide cloud-accessible sensor resources\nC) To eliminate all communication between sensors\nD) To replace the sensing function of WSN nodes", "answer": "Correct Answer: B", "solution": "Detailed Solution: A middleware layer provides an abstraction between resource-constrained, heterogeneous sensor networks and cloud platforms. It can handle resource discovery, data collection, protocol translation, virtualization/abstraction, and service management, allowing cloud applications to access sensor resources more conveniently."}, {"q_num": 8, "question": "Which architecture is generally BEST suited for applications requiring both low latency and large- scale cloud analytics?", "options": "A) IoT Device \u2192 Cloud only\nB) IoT Device \u2192 Edge/Fog \u2192 Cloud\nC) IoT Device \u2192 Database only\nD) IoT Device \u2192 Hypervisor \u2192 Cloud", "answer": "Correct Answer: B", "solution": "Detailed Solution: An Edge/Fog\u2013Cloud architecture combines local processing for latency- sensitive tasks with cloud resources for large-scale storage, historical analysis, and computationally intensive workloads."}, {"q_num": 9, "question": "An IoT application sends sensitive sensor data through public networks to a cloud platform. Which mechanism is MOST important for protecting the data during transmission?", "options": "A) Data encryption\nB) Increasing CPU frequency\nC) Increasing sensor sampling rate\nD) VM consolidation", "answer": "Correct Answer: A", "solution": "Detailed Solution: Encryption protects data while it travels between IoT devices, gateways, and cloud services. Secure communication protocols such as TLS can help prevent unauthorized parties from reading or modifying data in transit."}, {"q_num": 10, "question": "Statement 1: Processing latency-sensitive IoT workloads at an edge node can reduce the communication delay associated with a distant cloud. Statement 2: Edge processing eliminates all network latency because no communication is required.", "options": "A) Statement 1 is True and Statement 2 is False\nB) Statement 2 is True and Statement 1 is False\nC) Both statements are True\nD) Both statements are False", "answer": "Correct Answer: A", "solution": "Detailed Solution: Edge computing reduces latency by moving processing closer to the data source, but some communication latency still exists. Therefore, it does not eliminate network latency completely."}], "Week 9": [{"q_num": 1, "question": "A factory requires machine-level anomaly detection within milliseconds, but it also needs to aggregate data from multiple machines for plant-wide analysis before sending summaries to the cloud. Which placement BEST matches the requirements?", "options": "A) All processing in the centralized cloud\nB) Machine-level processing at the edge and plant-level processing at fog nodes\nC) All processing directly on individual sensors\nD) Plant-wide processing exclusively at the cloud", "answer": "Correct Answer: B", "solution": "Detailed Solution: Edge computing is appropriate for extremely latency-sensitive processing close to individual machines. Fog computing provides an intermediate layer capable of aggregating and analyzing information across multiple edge devices before forwarding relevant data to the cloud."}, {"q_num": 2, "question": "A smart-city traffic system receives video streams from hundreds of cameras. Immediate object detection is performed near each camera, regional congestion patterns are analyzed at roadside micro-data centers, and long-term traffic trends are analyzed in the cloud. Which architecture BEST represents this system?", "options": "A) Cloud-only architecture\nB) Fog-only architecture\nC)  Edge\u2013Fog\u2013Cloud architecture\nD) Edge-only architecture", "answer": "Correct Answer: C", "solution": "Detailed Solution: The architecture uses Edge Computing for immediate processing near individual cameras, Fog Computing for regional aggregation and coordination, and Cloud Computing for large-scale historical analytics and storage. Therefore, the complete architecture is Edge\u2013Fog\u2013Cloud."}, {"q_num": 3, "question": "An IoT system performs local filtering before forwarding data to the cloud. Which ordering BEST represents the typical amount of raw data transmitted toward centralized cloud infrastructure, from lowest to highest?", "options": "A) Edge processing \u2192 Fog processing \u2192 Cloud-only processing\nB) Cloud-only processing \u2192 Fog processing \u2192 Edge processing\nC) Fog processing \u2192 Cloud-only processing \u2192 Edge processing\nD) Edge processing \u2192 Cloud-only processing \u2192 Fog processing", "answer": "Correct Answer: A", "solution": "Detailed Solution: When processing occurs at the edge, unnecessary data can be filtered before transmission. Fog processing can also aggregate data regionally. In a cloud-only approach, much more raw data may need to travel to centralized infrastructure."}, {"q_num": 4, "question": "A fog node is running out of memory, but the infrastructure allows additional RAM and CPU resources to be assigned to that same node. Which scalability approach is being used?", "options": "A) Horizontal scalability\nB) Temporal scalability\nC) Geographic scalability\nD)  Vertical scalability", "answer": "Correct Answer: D", "solution": "Detailed Solution: Vertical scalability (scale-up) increases the resources of an existing node, such as CPU, RAM, or storage. Horizontal scalability, in contrast, adds additional nodes."}, {"q_num": 5, "question": "Which statement BEST describes the division of responsibilities in a hierarchical Edge\u2013Fog\u2013Cloud architecture?", "options": "A) Edge handles global optimization, while Cloud handles sensor-level decisions\nB) Edge handles immediate local actions, Fog coordinates regional resources, and Cloud performs\nglobal orchestration\nC) All three layers perform exactly the same tasks\nD) Only the Cloud is allowed to make decisions", "answer": "Correct Answer: B", "solution": "Detailed Solution: A hierarchical architecture distributes decision-making according to proximity and scope: Edge \u2192 immediate local decisions, Fog \u2192 regional coordination and resource management, Cloud \u2192 global policies, optimization, and long-term analytics"}, {"q_num": 6, "question": "A video analytics application requires its first-stage processing to occur within 10 ms of the camera, while its model-training component requires substantial computational resources. Which placement is MOST appropriate?", "options": "A) Both components on a distant cloud server\nB) Both components on the smallest IoT device\nC) First-stage processing at the edge and model training in the cloud\nD) First-stage processing only in the cloud and training at the edge", "answer": "Correct Answer: C", "solution": "Detailed Solution: The latency-sensitive component should be placed close to the camera at the edge, while computationally intensive model training can be performed in the cloud, where greater computational resources are available"}, {"q_num": 7, "question": "A mobile device is moving rapidly between coverage areas of different edge servers while executing an offloaded task. Which issue becomes MOST critical?", "options": "A) Static CPU allocation\nB) Service migration and task continuity during handover\nC) Cloud storage capacity\nD) VM image size only", "answer": "Correct Answer: B", "solution": "Detailed Solution: High mobility can cause a device to move from one edge server's coverage area to another. Maintaining service continuity may require task migration, service migration, or intelligent reassignment, while minimizing interruption and migration overhead."}, {"q_num": 8, "question": "A cloud application requires additional resources because its primary CSP has insufficient capacity. A broker identifies a suitable secondary CSP and negotiates the required service conditions. Which cloud-federation function is being performed?", "options": "A) Resource federation and inter-provider service provisioning\nB) VM deletion within a single CSP\nC) Local container orchestration\nD) Hardware virtualization", "answer": "Correct Answer: A", "solution": "Detailed Solution: In a cloud federation, a broker can discover resources from multiple CSPs and coordinate resource provisioning across providers. This enables an application to obtain additional capacity without depending entirely on a single provider."}, {"q_num": 9, "question": "Why is trust management particularly important in a cloud federation?", "options": "A) Resources and services may be obtained from independent providers with different security and\nreliability policies\nB) All CSPs are automatically controlled by the same organization\nC) Federation eliminates authentication requirements\nD) Trust is required only for physical servers", "answer": "Correct Answer: A", "solution": "Detailed Solution: Federated clouds involve independent CSPs, so providers may have different security practices, compliance requirements, reliability levels, and policies. Establishing trust and verifying provider behaviour is therefore critical."}, {"q_num": 10, "question": "Which is the PRIMARY advantage of a Hybrid Cloud Federation for an organization handling sensitive workloads?", "options": "A) It eliminates the need for security controls\nB) It forces all workloads into the public cloud\nC) It combines private-cloud control for sensitive workloads with public-cloud scalability\nD) It prevents workload migration between environments", "answer": "Correct Answer: C", "solution": "Detailed Solution: Hybrid federation provides a balance between security, control, compliance, and scalability. Sensitive applications can remain in private infrastructure, while less-sensitive or burst workloads can utilize public-cloud resources."}], "Week 10": [{"q_num": 1, "question": "During live migration of a VM, which condition is most likely to increase the total migration time?", "options": "A. Low rate of memory-page modification by the VM\nB. High rate of memory-page modification during migration\nC. Increasing the number of CPU cores on the destination host\nD. Reducing the VM memory size", "answer": "Answer: (B)", "solution": "Detailed Solution: In live migration, memory pages are copied while the VM continues running. If the VM modifies pages rapidly, many already-transferred pages become dirty and must be copied again. This increases the amount of data transferred and therefore increases migration time."}, {"q_num": 2, "question": "Which live VM migration technique starts the VM on the destination first and then fetches memory pages from the source on demand as they are accessed?", "options": "A) Cold migration\nB) Pre-copy migration\nC) Post-copy migration\nD) Offline image transfer", "answer": "Answer: C", "solution": "Detailed Solution: Post-copy migration resumes the VM on the destination immediately and then pulls memory pages from the source on demand (via page faults) or by background pushing. Pre-copy transfers memory before switching over, while cold and offline transfers require the VM to be stopped first."}, {"q_num": 3, "question": "Which technique is most likely to reduce the total data transferred (and hence the energy used) during pre-copy live migration?", "options": "A) Increasing the memory-dirtying rate of the workload\nB) Compressing and deduplicating memory pages before transfer\nC) Adding more iterative pre-copy rounds indefinitely\nD) Disabling dirty-page tracking", "answer": "Answer: B", "solution": "Detailed Solution: Memory compression and deduplication cut the volume of data sent over the network, reducing migration time and energy. A higher dirtying rate increases retransmissions, unlimited extra rounds waste bandwidth, and disabling dirty-page tracking breaks pre-copy correctness."}, {"q_num": 4, "question": "Which resource management strategy is most important to prevent overload when many edge devices send data to nearby fog nodes?", "options": "A) Increasing storage capacity at a single fog node\nB) Static task allocation\nC) Load balancing across fog nodes\nD) Sending all data directly to the cloud", "answer": "Correct Answer: (C)", "solution": "Detailed Solution:  When many edge devices send data, one fog node can become overloaded. Static allocation or just adding storage doesn\u2019t handle changing workloads well. Load balancing spreads tasks across multiple fog nodes, avoiding congestion and keeping latency low. Sending all data to the cloud increases delay and bandwidth use, defeating the purpose of fog computing."}, {"q_num": 5, "question": "A Kubernetes cluster has several worker nodes. A newly created Pod must be assigned to an appropriate node based on available resources and scheduling constraints. Which Kubernetes component is primarily responsible for this decision?", "options": "A. kubelet\nB. kube-scheduler\nC. kube-proxy\nD. Container registry", "answer": "Correct Answer: B", "solution": "Detailed Solution: The kube-scheduler selects an appropriate worker node for newly created Pods. It considers factors such as resource requirements, node availability, affinity rules, and scheduling constraints. The kubelet subsequently manages the Pod on the selected node."}, {"q_num": 6, "question": "Consider the following Docker workflow: Dockerfile \u2192 docker build \u2192 ______ \u2192 docker run Which entity is produced by the docker build operation?", "options": "A. Docker volume\nB. Docker image\nC. Running container\nD. Kubernetes Pod", "answer": "Correct Answer: B", "solution": "Detailed Solution: The docker build command processes instructions in a Dockerfile and creates a Docker image. A container is subsequently created from an image when docker run is executed."}, {"q_num": 7, "question": "Which of the following correctly describes the roles of Linux namespaces and cgroups in containers?", "options": "A. Namespaces provide resource quotas, while cgroups provide process isolation.\nB. Namespaces provide isolation of processes and system resources, while cgroups control resource\nusage.\nC. Both namespaces and cgroups are used only to create Docker images.\nD. Neither is required for container isolation.", "answer": "Correct Answer: B", "solution": "Detailed Solution: Linux namespaces isolate processes and provide separate views of resources such as process IDs, networking, and mount points. cgroups restrict and monitor resource usage such as CPU and memory. Together, they provide important mechanisms for container isolation and resource control."}, {"q_num": 8, "question": "A VM has 32 GB of memory and the migration link provides 16 MB/sec of usable throughput. For a non-live (cold) migration where the entire memory is transferred once, what is the approximate transfer time? (Use 1 GB = 2\u00b3\u2070 bytes, 1 MB = 2\u00b2\u2070 bytes.)", "options": "A) About 15 minutes\nB) About 34 minutes\nC) About 1 hour\nD) About 2 hours", "answer": "Answer: B", "solution": "Solution: Time = (32 \u00d7 2\u00b3\u2070) / (16 \u00d7 2\u00b2\u2070) = (32 \u00d7 1024) / 16 = 32768 / 16 = 2048 seconds \u2248 34 minutes."}, {"q_num": 9, "question": "A database container is deleted accidentally. The database files were stored using a Docker named volume rather than only inside the container's writable layer. What happens to the data?", "options": "A. The data is automatically deleted with the container.\nB. The data remains available in the named volume.\nC. The data is converted into a Docker image.\nD. The data can only be recovered by restarting the deleted container.", "answer": "Correct Answer: B", "solution": "Detailed Solution: Docker volumes have a lifecycle independent of individual containers. Deleting a container does not normally delete the data stored in its named volume. This makes volumes appropriate for persistent application data."}, {"q_num": 10, "question": "Which of the following statements about containers and virtual machines is CORRECT?", "options": "A. Containers normally require a separate complete guest operating system for every application.\nB. Virtual machines and containers always provide identical levels of isolation.\nC. Containers generally share the host operating system kernel, whereas VMs virtualize a complete\nmachine environment.\nD. Containers cannot be deployed on virtual machines.", "answer": "Correct Answer: C", "solution": "Detailed Solution: Containers share the host OS kernel and therefore generally require fewer resources and start faster. A virtual machine provides a virtualized hardware environment in which a separate guest operating system runs. Containers can also run inside virtual machines, so option D is incorrect."}], "Week 11": [{"q_num": 1, "question": "Which capability is the defining feature of Dew computing compared to conventional cloud computing?", "options": "A) It requires a permanent high-bandwidth connection to the cloud\nB) It provides local independence, letting a device store and process data offline and sync with the\ncloud when connectivity returns\nC) It eliminates the need for any cloud component\nD) It performs only data storage and never computation", "answer": "Answer: B", "solution": "Solution: Dew computing's defining feature is local independence with later synchronization \u2014 devices keep working offline and reconcile with the cloud once reconnected. It complements rather than replaces the cloud, and supports both storage and computation."}, {"q_num": 2, "question": "A weather-monitoring device installed in a remote mountain region must continue recording and processing measurements for several hours even when the Internet connection is unavailable. Once connectivity is restored, the accumulated data is synchronized with a cloud server. Which computing paradigm best matches this requirement?", "options": "A) Edge computing\nB) Fog computing\nC) Dew computing\nD) Centralized cloud computing", "answer": "Correct Answer: C", "solution": "Detailed Solution: Dew computing emphasizes autonomous operation at or near end devices. A dew-enabled device can continue functioning during network outages and synchronize its locally generated data with the cloud when connectivity becomes available."}, {"q_num": 3, "question": "Two users modify the same record independently while their devices are offline. When both devices reconnect, the cloud detects that the two versions conflict. Which mechanism is most directly required to handle this situation?", "options": "A) CPU scheduling\nB) Conflict detection and resolution during synchronization\nC) Container image creation\nD) Load balancing", "answer": "Correct Answer: B", "solution": "Detailed Solution: Independent offline updates can create conflicting versions of the same data. During synchronization, the system must detect these conflicts and apply an appropriate resolution policy to restore a consistent state."}, {"q_num": 4, "question": "Allowing Dew devices to operate offline and modify data independently most directly introduces which challenge?", "options": "A) Increased CPU virtualization overhead\nB) The need to detect and resolve data conflicts when devices reconnect and synchronize\nC) Permanent loss of all local data\nD) Inability to ever reach the cloud", "answer": "Answer: B", "solution": "Detailed Solution: Independent offline modification lets copies of the data diverge, so the main challenge is detecting and resolving conflicts during synchronization to restore consistency \u2014 the autonomy-vs-consistency trade-off."}, {"q_num": 5, "question": "A serverless function has not been invoked for a long period. When the next request arrives, the platform requires additional time to initialize the execution environment. This delay is known as:", "options": "A) Warm start\nB) Cold start\nC) Cache miss\nD) Bootstrapping failure", "answer": "Correct Answer: B", "solution": "Detailed Solution:  A cold start occurs when the serverless platform needs to create or initialize a new execution environment before processing a request. This initialization introduces additional latency."}, {"q_num": 6, "question": "Why are serverless functions typically designed to be stateless?", "options": "A) To reduce electricity consumption\nB) Because local storage is unlimited\nC) To allow automatic scaling and parallel execution without dependency conflicts\nD) To avoid using APIs", "answer": "Correct Answer: C", "solution": "Detailed Solution: Statelessness ensures each function invocation is independent, allowing the platform to scale horizontally and run multiple instances in parallel without coordination issues."}, {"q_num": 7, "question": "A team wants to run a batch job that takes about 45 minutes to complete in a single AWS Lambda invocation. Why is this NOT feasible?", "options": "A) Lambda has no internet access\nB) Lambda enforces a maximum execution timeout of 15 minutes per invocation\nC) Lambda cannot process batch data\nD) Lambda functions must always be stateful", "answer": "Answer: B", "solution": "Solution: A single AWS Lambda invocation is capped at 15 minutes (900 seconds), so a 45-minute job cannot finish in one invocation. Such workloads must be split into smaller units or run on a service without this limit (e.g., containers, AWS Batch, or EC2)."}, {"q_num": 8, "question": "A serverless application receives 1,000 independent requests simultaneously. The provider can create multiple function instances to process these requests concurrently. Which property of serverless computing makes this possible?", "options": "A) Stateful execution\nB) Horizontal scalability of independent function invocations\nC) Fixed allocation of one VM per user\nD) Permanent local storage", "answer": "Correct Answer: B", "solution": "Detailed Solution: Serverless platforms can automatically create multiple function instances as demand increases. Stateless or independently executable functions are especially suitable for such parallel execution and horizontal scaling."}, {"q_num": 9, "question": "A research group wants to execute a scientific computation that requires 40 minutes of uninterrupted execution for each task. The chosen FaaS platform imposes a maximum execution time of 15 minutes per invocation. What is the primary problem with using this platform directly?", "options": "A) Functions cannot communicate with databases.\nB) The execution time exceeds the platform's maximum invocation duration.\nC) FaaS cannot process numerical calculations.\nD) Serverless functions cannot execute in parallel.", "answer": "Correct Answer: B", "solution": "Detailed Solution:  A FaaS platform imposes a maximum execution duration for each invocation. A computation requiring 40 minutes cannot be completed in a single invocation when the platform limit is 15 minutes."}, {"q_num": 10, "question": "A company needs a managed cloud platform specifically designed for large-scale analytical queries over structured datasets, using distributed processing rather than relying on a single database server. Which service is most appropriate?", "options": "A. Amazon Redshift\nB. Amazon EC2\nC. AWS Lambda\nD. Amazon Route 53", "answer": "Correct Answer: A", "solution": "Detailed Solution: Amazon Redshift is a managed cloud data warehouse designed for large-scale analytical workloads. It uses distributed query processing and column-oriented techniques to efficiently analyze large datasets."}], "Week 12": [{"q_num": 1, "question": "Mobile Cloud Computing (MCC) benefits mobile devices by: 1. Offloading compute-intensive tasks to the cloud 2. Extending effective battery life by reducing on-device processing 3. Guaranteeing zero network latency 4. Providing access to large-scale storage", "options": "A) 1, 2, and 4 only\nB) 1 and 3 only\nC) 2 and 3 only\nD) All of the above", "answer": "Answer: A", "solution": "Solution: MCC offloads heavy computation (1), which helps conserve battery (2), and provides scalable cloud storage (4). It cannot guarantee zero latency (3), since wireless communication always introduces some delay."}, {"q_num": 2, "question": "A city planning department stores road networks, building locations, GPS coordinates, and satellite images in a cloud-based system for analysis. This is primarily an example of:", "options": "A. Mobile Cloud Computing\nB. Spatial Cloud Computing\nC. Serverless Computing\nD. Batch Computing", "answer": "Correct Answer: B", "solution": "Detailed Solution: Spatial Cloud Computing focuses on managing and processing geospatial information such as coordinates, maps, GIS layers, and satellite imagery."}, {"q_num": 3, "question": "Which task is MOST likely to rely on Spatial Cloud Computing?", "options": "A) Sorting a company's payroll spreadsheet\nB) Real-time flood-risk mapping using terrain and rainfall data across a region\nC) Compiling source code\nD) Streaming a music playlist", "answer": "Answer: B", "solution": "Solution: Region-scale flood-risk mapping combines terrain, rainfall, and location data \u2014 large-scale geospatial analytics well suited to spatial cloud systems. The other tasks involve no spatial data."}, {"q_num": 4, "question": "In Cyber-Physical Systems (CPS), real-time feedback between sensors and actuators is essential for:", "options": "A) Data archiving\nB) Closed-loop control\nC) Static data analysis\nD) Batch processing", "answer": "Correct Answer: B", "solution": "Detailed Solution: Cyber-Physical Systems tightly integrate sensing, computation, and actuation. Sensors collect data from the physical world, computation processes it, and actuators respond \u2014 forming a closed-loop control system, which is a core principle of CPS."}, {"q_num": 5, "question": "A GPS-enabled taxi periodically records its location as: (x1,y1,t1),(x2,y2,t2),\u2026,(xn,yn,tn) What does this sequence represent?", "options": "A. Spatial trajectory\nB. Spatial database\nC. Road topology\nD. Spatial index", "answer": "Correct Answer: A", "solution": "Detailed Solution: A spatial trajectory represents the movement of an object through geographical space as a sequence of time-ordered spatial positions. Such trajectories are useful in transportation and mobility analysis."}, {"q_num": 6, "question": "__________ refers to outsourcing location-based sensing or data-collection tasks to a crowd of mobile users who gather data at specific places and times.", "options": "A. Spatial trajectory\nB. Spatial crowdsourcing\nC. Time series\nD. Road network graph", "answer": "Answer: B", "solution": "Solution: Spatial crowdsourcing assigns location- and time-specific sensing tasks to mobile participants (e.g., reporting road conditions or air quality at given spots). A spatial trajectory is instead a moving object's time-ordered path, not a task-assignment paradigm."}, {"q_num": 7, "question": "In V2V communication, the primary objective is:", "options": "A) Providing internet access to vehicles\nB) Exchanging safety-critical information such as speed, position, and braking\nC) Supporting infotainment systems\nD) Uploading vehicle data to cloud storage", "answer": "Correct Answer: B", "solution": "Detailed Solution: V2V focuses on direct vehicle-to-vehicle safety messaging (speed, heading, braking, lane changes) to prevent collisions. It is not meant for entertainment or internet access."}, {"q_num": 8, "question": "A connected-vehicle system where onboard sensors capture data, roadside units preprocess and react locally, and the cloud performs fleet-wide long-term analytics is BEST described as:", "options": "A) Cloud-only computing\nB) Edge computing with no cloud\nC) An integrated Edge\u2013Fog\u2013Cloud architecture\nD) A single centralized server", "answer": "Answer: C", "solution": "Solution: Onboard sensors (edge), roadside units doing local preprocessing/reaction (fog), and the cloud handling long-term fleet analytics distribute computation across three layers \u2014 an integrated Edge\u2013Fog\u2013Cloud architecture, not a cloud-only or edge-only system."}, {"q_num": 9, "question": "A major benefit of real-time mobility analytics in urban transport systems is:", "options": "A) Eliminating the need for traffic laws\nB) Dynamic traffic signal optimization based on live vehicle density\nC) Reducing vehicle manufacturing costs\nD) Preventing all road accidents", "answer": "Correct Answer: B", "solution": "Detailed Solution: Real-time analytics uses live data from sensors, cameras, and GPS to adapt traffic signals and routes dynamically, reducing congestion and delays."}, {"q_num": 10, "question": "A multimedia application needs to deliver extremely high-resolution video and augmented-reality content to mobile users. Which 5G service category is most directly suited to this requirement?", "options": "A. eMBB\nB. mMTC\nC. URLLC\nD. NFC", "answer": "Correct Answer: A", "solution": "Detailed Solution:  Enhanced Mobile Broadband (eMBB) is designed to provide very high data rates and improved bandwidth efficiency. It is therefore well suited to applications such as high-resolution video and AR/VR streaming."}]};

function init() {
  const list = document.getElementById('weekList');
  for (let w = 1; w <= 12; w++) {
    const item = document.createElement('div');
    item.className = 'week-item' + (w === 1 ? ' active' : '');
    item.innerText = weekTitles[w] || `Week ${w}`;
    item.onclick = () => selectWeek(w);
    list.appendChild(item);
  }
  selectWeek(1);
}

function selectWeek(w) {
  stopSpeech();
  currentWeek = w;
  
  document.querySelectorAll('.week-item').forEach((el, idx) => {
    el.className = 'week-item' + (idx + 1 === w ? ' active' : '');
  });
  
  document.getElementById('driveLinkBtn').href = driveLinks[w];
  
  const wKey = `Week ${w}`;
  const qs = assignmentsData[wKey] || [];
  const area = document.getElementById('contentArea');
  
  let html = `
    <div class="banner-card">
      <h2>${weekTitles[w]}</h2>
      <p>Target: <strong>Elite + Gold Medal (Score &ge; 90%)</strong>. Below is the full 10-question solved breakdown with distractor analysis. Click <strong>Play AI Explainer</strong> to hear voice narration, or copy the prompt into <strong>NotebookLM</strong> to generate a Deep Dive Audio Overview podcast!</p>
    </div>
    
    <div class="prompt-box">
      <h4>NotebookLM Audio Overview Custom Prompt (${wKey})</h4>
      <code>You are an expert professor conducting an intense exam preparation masterclass on NPTEL Cloud Computing (${wKey}). The student is aiming for the Elite + Gold certification (>=90%). Step through each of the 10 graded assignment questions in detail: explain why the accepted answer is undeniably correct, why each distractor is wrong, and highlight recurring exam traps.</code>
    </div>
  `;
  
  qs.forEach((q, idx) => {
    html += `
      <div class="question-card" id="qcard-${idx}">

        <div class="q-ans">&#10004; Accepted Answer: ${q.answer}</div>
        <div class="q-sol">${q.solution}</div>
      </div>
    `;
  });
  
  area.innerHTML = html;
}

function copyNotebookPrompt() {
  const prompt = `You are an expert professor conducting an intense exam preparation masterclass on NPTEL Cloud Computing (Week ${currentWeek}). The student is aiming for the Elite + Gold certification (>=90%). Step through each of the 10 graded assignment questions in detail: explain why the accepted answer is undeniably correct, why each distractor is wrong, and highlight recurring exam traps.`;
  navigator.clipboard.writeText(prompt);
  alert(`Copied Week ${currentWeek} NotebookLM Custom Prompt to clipboard! Paste it into NotebookLM's Customize Audio Overview box.`);
}

function toggleSpeech() {
  if (isSpeaking) {
    stopSpeech();
  } else {
    startSpeech();
  }
}

function startSpeech() {
  if (!('speechSynthesis' in window)) {
    alert('Speech synthesis is not supported in this browser.');
    return;
  }
  
  stopSpeech();
  isSpeaking = true;
  document.getElementById('playIcon').innerText = '⏸';
  document.getElementById('playText').innerText = 'Pause Explainer';
  
  const wKey = `Week ${currentWeek}`;
  const qs = assignmentsData[wKey] || [];
  
  let queue = [];
  queue.push(`Welcome to the NPTEL Cloud Computing masterclass for ${weekTitles[currentWeek]}. Let us review the ten assignment questions and answers for your Elite plus Gold certification.`);
  
  qs.forEach((q, idx) => {
    queue.push(`Question ${q.q_num}: ${q.question}. The accepted answer is ${q.answer}. ${q.solution}`);
  });
  
  let step = 0;
  function speakNext() {
    if (!isSpeaking || step >= queue.length) {
      stopSpeech();
      return;
    }
    
    // Highlight active card
    document.querySelectorAll('.question-card').forEach(c => c.classList.remove('narrating'));
    if (step > 0 && step <= qs.length) {
      const card = document.getElementById(`qcard-${step - 1}`);
      if (card) {
        card.classList.add('narrating');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
    
    currentUtterance = new SpeechSynthesisUtterance(queue[step]);
    currentUtterance.rate = 1.0;
    currentUtterance.onend = () => {
      step++;
      speakNext();
    };
    currentUtterance.onerror = () => {
      step++;
      speakNext();
    };
    synth.speak(currentUtterance);
  }
  
  speakNext();
}

function stopSpeech() {
  if (synth) synth.cancel();
  isSpeaking = false;
  const playIcon = document.getElementById('playIcon');
  const playText = document.getElementById('playText');
  if (playIcon) playIcon.innerText = '▶';
  if (playText) playText.innerText = 'Play AI Explainer';
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('narrating'));
}

window.onload = init;
</script>
